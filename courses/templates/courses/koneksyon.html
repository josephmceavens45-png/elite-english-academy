<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksyon - Elite English Academy</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { 
            text-align: center; 
            color: #1a365d; 
            margin-bottom: 5px; 
            font-size: 24px;
        }
        p.subtitle {
            text-align: center; 
            color: #718096; 
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            color: #4a5568; 
            font-size: 14px;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #3182ce;
        }
        button { 
            width: 100%; 
            background-color: #1a365d; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 10px; 
            transition: background-color 0.2s;
        }
        button:hover { 
            background-color: #2c5282; 
        }
        .alert {
            background-color: #fed7d7;
            color: #9b2c2c;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
        }
        .footer-link a {
            color: #d97706;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Elite English Academy</h2>
    <p class="subtitle">Konekte sou kont ou an</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Imel</label>
            <input type="email" name="email" placeholder="egzanp@gmail.com" required>
        </div>

        <div class="form-group">
            <label>Mo de pas</label>
            <input type="password" name="password" placeholder="Mete mo de pas ou an" required>
        </div>

        <button type="submit">Konekte</button>
    </form>

    <div class="footer-link">
        Poko gen yon kont? <a href="{% url 'enskripsyon' %}">Enskri la a</a>
    </div>
</div>

</body>
</html>
