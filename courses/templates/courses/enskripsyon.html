{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">Elite English Academy</h3>
                    <p class="text-muted">Kreye kont etidyan pa w la</p>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-user me-2 text-primary"></i>Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Chwazi yon username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-lock me-2 text-primary"></i>Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fa-brands fa-whatsapp me-2 text-success"></i>Nimewo WhatsApp</label>
                        <input type="text" name="whatsapp" class="form-control" placeholder="+509 3600 0000" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-layer-group me-2 text-primary"></i>Nivo nan Angle</label>
                        <select name="level" class="form-select" required>
                            <option value="beginner">🟢 Beginner (Debitan)</option>
                            <option value="intermediate">🟡 Intermediate (Mwayen)</option>
                            <option value="advanced">🔴 Advanced (Avanse)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                        Enskri Kounye a <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>

                    <p class="text-center text-muted mb-0">
                        Ou gen yon kont deja? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-bold">Konekte</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
