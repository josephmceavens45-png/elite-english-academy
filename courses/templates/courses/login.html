{% extends 'courses/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="text-center mb-3">
                      <img src="{% static 'staticfiles/english.jpg' %}" alt="Logo Elite English Academy" class="img-fluid" style="max-height: 90px;">
                    </div>
                    <h3 class="fw-bold text-dark">Elite English Academy</h3>
                    <p class="text-muted">Antre username ak password ou pou w rantre</p>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-user me-2 text-primary"></i>Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Antre username ou" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-lock me-2 text-primary"></i>Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                        Konekte <i class="fa-solid fa-right-to-bracket ms-2"></i>
                    </button>

                    <p class="text-center text-muted mb-0">
                        Ou pa gen kont? <a href="{% url 'enskripsyon' %}" class="text-primary text-decoration-none fw-bold">Enskri la a</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
